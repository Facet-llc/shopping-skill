name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: lint, type-check, test, mainnet-clean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        run: deno task lint

      - name: Type-check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Mainnet-clean gate (no non-production network refs in the published skill)
        run: |
          if git grep -nEi 'sepolia|84532|testnet' -- ':!.github/**'; then
            echo "::error::A non-production network reference is present. This public skill is mainnet-only; the sandbox plane lives in shopping-skill-dev."
            exit 1
          fi
          echo "mainnet-clean: no non-production network references in the published skill"
